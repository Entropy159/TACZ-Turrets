modLoader = "javafml"
loaderVersion = "[4,)"
license = "${license}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${authors}"
description = '''${description}'''
logoFile = "assets/tacz_turrets/icon.png"

[[mixins]]
config = "mixins.${id}.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "${loader_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "tacz"
type = "required"
versionRange = "[${tacz},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${id}]]
modId = "smartbrainlib"
type = "required"
versionRange = "[${smartbrainlib},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "geckolib"
type = "required"
versionRange = "[${geckolib},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "ftbteams"
type = "optional"
versionRange = "[${ftbteams_min},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "openpartiesandclaims"
type = "optional"
versionRange = "[${opac_min},)"
ordering = "NONE"
side = "BOTH"
